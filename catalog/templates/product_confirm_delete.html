{% extends 'base.html' %}

{% block title %}Удаление{% endblock %}

{% block content %}
<div class="container">
        <h1 class="mt-5">Удалить продукт: {{ product.name }}?</h1>
        {% if perms.catalog.Can_delete_product %}
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger mt-5">Удалить</button>
                <a class="btn btn-primary mt-5" href="{% url 'catalog:home' %}">Отменить</a>
            </form>
        {% endif %}
    </div>
{% endblock %}
