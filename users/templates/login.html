{% extends 'base.html' %}

{% block title %}Вход{% endblock %}

{% block content %}
{% include 'menu.html' %}
<div class="container">
    <h1 class="mt-5">Войти в приложение</h1>
    <form class="row" method="post" enctype="multipart/form-data">
      <div class="col-6">
        <div class="card">
          <div class="card-body">
            {% csrf_token %}
            {{ form.as_p }}
          </div>
          <button type="submit" class="btn btn-primary">
            Войти
          </button>
        </div>
      </div>
    </form>
    <a href="{% url 'catalog:home' %}" class="btn btn-secondary mt-3">Назад к списку товаров</a>
</div>
{% endblock %}
